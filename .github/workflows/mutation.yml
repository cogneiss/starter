name: mutation

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

# Coverage says every line ran; mutation says a test actually fails when you
# break the line. This job is deliberately non-blocking: gating a PR on the
# mutation score teaches people to write tests that satisfy the mutator, which
# is worse than not measuring. The score is published to the job summary and
# left to drift upward on its own. `app/Actions` alone scores 79.32% and takes
# about six minutes locally; if the whole of `app/` ever outgrows the timeout,
# narrow `--path` rather than raising the timeout indefinitely.
jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          tools: composer:v2
          coverage: pcov
          ini-values: zend.assertions=1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Install Bun Dependencies
        run: bun install

      - name: Build Assets
        run: bun run build

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Mutation Score
        id: mutate
        continue-on-error: true
        run: composer test:mutate | tee mutation.log

      - name: Publish Score
        if: always()
        run: |
          {
            echo "## Mutation score"
            echo
            echo '```'
            tail -n 20 mutation.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
