name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

# release-please reads the conventional-commit prefixes on main, keeps a release
# pull request open with the generated CHANGELOG.md and the version bump, and
# tags the release when that pull request is merged.
jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
