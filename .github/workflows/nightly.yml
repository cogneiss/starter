name: nightly

on:
  schedule:
    # 03:17 UTC, off the hour so it does not queue behind everyone else's
    # midnight cron.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

# Dev and CI run SQLite; forks deploy Postgres. UUID primary keys, JSON
# columns, `ORDER BY` without a tiebreaker and case-sensitive `LIKE` are where
# the two disagree. This is nightly rather than per-PR because it doubles the
# suite runtime to catch a class of bug that appears rarely.
jobs:
  pgsql:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      issues: write

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          tools: composer:v2
          coverage: pcov
          extensions: pdo_pgsql
          ini-values: zend.assertions=1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Install Bun Dependencies
        run: bun install

      - name: Build Assets
        run: bun run build

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(bun pm ls 2>/dev/null | grep playwright | head -1 | sed 's/.*@//')" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps

      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps

      - name: Tests
        run: composer test:pgsql
        env:
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

      - name: Store Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-screenshots
          path: tests/Browser/Screenshots

      # A red badge on a scheduled run is a notification nobody clicks, so the
      # failure becomes an issue instead. `is:open` keeps a week of failures in
      # one thread rather than one issue per night.
      - name: Open An Issue On Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing="$(gh issue list --label nightly --state open --limit 1 --json number --jq '.[0].number')"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "The nightly Postgres run failed again: $RUN_URL"
          else
            gh issue create \
              --title "Nightly Postgres run failed" \
              --label nightly \
              --body "The suite passes on SQLite but failed on Postgres 17: $RUN_URL"
          fi

