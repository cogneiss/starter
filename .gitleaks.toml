# gitleaks configuration.
#
# Extends the bundled default ruleset rather than replacing it — the upstream
# rules are maintained far more often than this file will be.
#
# Run locally with:
#   gitleaks dir . --config .gitleaks.toml --redact --no-banner
#
# --redact is not optional in CI. Without it a hit is printed verbatim into a
# public log, which is worse than not scanning at all.

title = "cogneiss/starter"

[extend]
useDefault = true

[allowlist]
description = "Paths that legitimately contain key-shaped strings"
paths = [
    # Placeholder values only; the real .env is gitignored.
    '''^\.env\.example$''',
    # Lockfiles are full of long base64 integrity hashes.
    '''^bun\.lock$''',
    '''^composer\.lock$''',
    '''^package-lock\.json$''',
    # Generator templates: fake tokens and sample credentials by design.
    '''^stubs/.*''',
    # Test fixtures: fabricated keys, passkey blobs and OAuth payloads.
    '''^tests/.*''',
    '''^database/factories/.*''',
    # This file's own regexes look like secrets to the scanner.
    '''^\.gitleaks\.toml$''',
    # Generated dependency-graph artifacts; rebuilt, never authored.
    '''^graphify-out/.*''',
    '''^\.gitnexus/.*''',
    '''^\.code-review-graph/.*''',
    # Installed dependencies. Not committed, and their maintainers' test keys
    # and PEM fixtures are not this repo's problem. `gitleaks git` never sees
    # them; this only keeps the working-tree scan honest.
    '''^vendor/.*''',
    '''^node_modules/.*''',
    # Boost-generated agent guidelines. `rules/config.md` documents Laravel's
    # config helper with a `'key' => 'some-long-value'` example that trips the
    # generic-api-key rule. The file is regenerated by `boost:install`, so
    # editing it is not an option.
    '''^\.[a-z]+/skills/.*''',
    '''^\.github/skills/.*''',
]

regexes = [
    # Laravel's documented placeholder APP_KEY shape in docs and examples.
    '''base64:[A-Za-z0-9+/=]{0,10}$''',
]
